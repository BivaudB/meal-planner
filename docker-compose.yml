# Infrastructure locale : PostgreSQL 18 + Keycloak (serveur OAuth2 / OpenID Connect)
# + téléchargement initial du référentiel Ciqual dans ./data
# Démarrage : docker compose up -d
services:
  postgres:
    image: postgres:18
    container_name: meal-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-meal_planner}
      POSTGRES_USER: ${DB_USER:-meal_planner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meal_planner}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Depuis PostgreSQL 18, l'image attend le volume sur /var/lib/postgresql (et non plus .../data)
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Téléchargement unique de la table Ciqual 2025 (Anses) dans ./data/ciqual.xlsx.
  # Le backend l'importe au démarrage si la table des aliments est vide.
  # Ne fait rien si le fichier est déjà présent (supprimez-le pour forcer une mise à jour).
  ciqual-download:
    image: curlimages/curl:8.17.0
    container_name: meal-planner-ciqual-download
    restart: "no"
    user: root
    environment:
      CIQUAL_URL: ${CIQUAL_URL:-https://entrepot.recherche.data.gouv.fr/api/access/datafile/666260}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -s /data/ciqual.xlsx ]; then
          echo "Ciqual déjà présent : /data/ciqual.xlsx"
        else
          echo "Téléchargement de Ciqual depuis $$CIQUAL_URL"
          curl -fSL --retry 3 -o /data/ciqual.xlsx.part "$$CIQUAL_URL" && mv /data/ciqual.xlsx.part /data/ciqual.xlsx
        fi
    volumes:
      - ./data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: meal-planner-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      # Base créée par infra/postgres/init/01-create-keycloak-db.sql
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/realm-meal-planner.json:/opt/keycloak/data/import/realm-meal-planner.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
