# Infrastructure locale : PostgreSQL 18 + Keycloak (serveur OAuth2 / OpenID Connect)
# Démarrage : docker compose up -d
services:
  postgres:
    image: postgres:18
    container_name: meal-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-meal_planner}
      POSTGRES_USER: ${DB_USER:-meal_planner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meal_planner}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Depuis PostgreSQL 18, l'image attend le volume sur /var/lib/postgresql (et non plus .../data)
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: meal-planner-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      # Base créée par infra/postgres/init/01-create-keycloak-db.sql
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/realm-meal-planner.json:/opt/keycloak/data/import/realm-meal-planner.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
